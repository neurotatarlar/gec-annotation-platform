name: Deploy server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy shared server
    runs-on: ubuntu-latest
    environment: server
    timeout-minutes: 30
    env:
      DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
      DEPLOY_PUBLIC_ORIGIN: ${{ vars.DEPLOY_PUBLIC_ORIGIN }}
      DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/opt/gec-app' }}
      DEPLOY_FRONTEND_DIST_DIR: ${{ vars.DEPLOY_FRONTEND_DIST_DIR || '/var/www/gec-frontend' }}
      DEPLOY_SERVICE_NAME: ${{ vars.DEPLOY_SERVICE_NAME || 'gec-backend' }}
      DEPLOY_GIT_SHA: ${{ github.sha }}

    steps:
      - name: Require main branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Deployments must be started from main; got $GITHUB_REF" >&2
            exit 1
          fi

      - name: Checkout selected commit
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: scripts/deploy_workflow.sh validate

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          if [[ -z "$SSH_PRIVATE_KEY" || -z "$SSH_KNOWN_HOSTS" ]]; then
            echo "DEPLOY_SSH_PRIVATE_KEY and DEPLOY_SSH_KNOWN_HOSTS are required" >&2
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          (umask 077; printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519")
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Check deployment tools
        run: |
          python3 --version
          rsync --version | head -n 1
          ssh -V

      - name: Preflight server
        run: scripts/deploy_workflow.sh preflight

      - name: Back up database
        run: scripts/deploy_workflow.sh backup

      - name: Deploy selected commit
        run: scripts/deploy_workflow.sh deploy

      - name: Verify deployment
        run: scripts/deploy_workflow.sh verify

      - name: Write deployment summary
        run: |
          {
            echo "## Deployment complete"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Server: \`$DEPLOY_SSH_HOST\`"
            echo "- URL: $DEPLOY_PUBLIC_ORIGIN"
          } >> "$GITHUB_STEP_SUMMARY"
